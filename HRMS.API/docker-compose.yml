services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=HrmsDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Cors__Origins__0: ${FRONTEND_ORIGIN}
      FileStorage__RootPath: /data/storage
      Serilog__WriteTo__1__Args__path: /data/logs/hrms-.log
    ports:
      - "8080:8080"
    volumes:
      - apidata:/data

volumes:
  dbdata:
  apidata:
